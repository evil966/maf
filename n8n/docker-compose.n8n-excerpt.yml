# Sanitized excerpt of E:\icountera\n8n-api_icountera\n8n\docker-compose.yml
# Secrets stay in that stack's .env — do not copy real passwords here.
# Apply changes in the icountera compose file, then:
#   docker compose -p n8n-api_icountera up -d
#
# Lines marked ADDED are what Narration Studio required. Everything else
# was already on the n8n-api_icountera stack.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
      TZ: ${GENERIC_TIMEZONE}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      ICOUNTERA_EMAIL: ${ICOUNTERA_EMAIL}
      ICOUNTERA_PASSWORD: ${ICOUNTERA_PASSWORD}
      # --- ADDED for Narration Studio ---
      N8N_CUSTOM_EXTENSIONS: /custom-nodes/n8n-nodes-narration-studio
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
    extra_hosts:
      # --- ADDED: container → Windows job API on :5088 ---
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      # --- ADDED: this repo's custom node (read-only) ---
      - E:/exercises/maf/n8n/n8n-nodes-narration-studio:/custom-nodes/n8n-nodes-narration-studio:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
